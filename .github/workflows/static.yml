<script>
// ── CANVAS NETWORK ANIMATION ──
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, nodes = [], animId;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function initNodes() {
  nodes = [];
  const count = Math.min(Math.floor(W * H / 16000), 60);
  for (let i = 0; i < count; i++) {
    nodes.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      r: Math.random() * 2.5 + 1
    });
  }
}

function drawFrame() {
  ctx.clearRect(0, 0, W, H);
  
  nodes.forEach(n => {
    n.x += n.vx; n.y += n.vy;
    if (n.x < 0 || n.x > W) n.vx *= -1;
    if (n.y < 0 || n.y > H) n.vy *= -1;
  });

  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[i].x - nodes[j].x;
      const dy = nodes[i].y - nodes[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 160) {
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.strokeStyle = `rgba(151, 115, 89, ${(1 - dist/160) * 0.2})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  nodes.forEach(n => {
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(151, 115, 89, 0.28)';
    ctx.fill();
  });

  animId = requestAnimationFrame(drawFrame);
}

resize();
initNodes();
drawFrame();
window.addEventListener('resize', () => { resize(); initNodes(); });

// ── TYPING EFFECT ──
const phrases = [
  "Unified Collaboration Engineer",
  "CCNP Collaboration Certified",
  "Cisco UCCX IVR Developer",
  "SIP / RTP Troubleshooting Expert",
  "Webex Hybrid Services Specialist",
  "Contact Center Architect"
];
let pi = 0, ci = 0, deleting = false;
const typedEl = document.getElementById('typed-text');

function type() {
  const current = phrases[pi];
  if (!deleting) {
    typedEl.textContent = current.substring(0, ci + 1);
    ci++;
    if (ci === current.length) {
      deleting = true;
      setTimeout(type, 1800);
      return;
    }
  } else {
    typedEl.textContent = current.substring(0, ci - 1);
    ci--;
    if (ci === 0) {
      deleting = false;
      pi = (pi + 1) % phrases.length;
    }
  }
  setTimeout(type, deleting ? 45 : 80);
}
type();

// ── SCROLL REVEAL ──
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      // Animate skill bars
      const bar = entry.target.querySelector('.skill-bar-fill');
      if (bar) {
        const w = bar.dataset.width;
        setTimeout(() => { bar.style.width = w + '%'; }, 200);
      }
    }
  });
}, { threshold: 0.15 });

document.querySelectorAll('.timeline-item, .skill-card, .cert-card, .blackbelt-card, .project-card, .stack-item').forEach((el, i) => {
  el.style.transitionDelay = (i % 6) * 0.08 + 's';
  observer.observe(el);
});

// ── NAVBAR SCROLL ──
window.addEventListener('scroll', () => {
  const nav = document.getElementById('navbar');
  if (window.scrollY > 40) {
    nav.style.background = 'rgba(240,244,248,0.92)';
    nav.style.boxShadow = '0 4px 32px rgba(0,80,200,0.12)';
  } else {
    nav.style.background = 'rgba(240,244,248,0.75)';
    nav.style.boxShadow = '0 2px 24px rgba(0,80,200,0.07)';
  }
});

// ── MOBILE NAV ──
function toggleMobileNav() {
  const links = document.querySelector('.nav-links');
  if (links.style.display === 'flex') {
    links.style.display = 'none';
  } else {
    links.style.cssText = 'display:flex;flex-direction:column;position:absolute;top:68px;left:0;right:0;background:rgba(240,244,248,0.97);padding:24px 5%;gap:16px;border-bottom:1px solid rgba(0,115,230,0.1);backdrop-filter:blur(20px);';
    links.querySelectorAll('a').forEach(a => { a.onclick = () => { links.style.display = 'none'; }; });
  }
}

// ── LIGHTBOX ──
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// Attach click to all cert images
document.querySelectorAll('.cert-img-wrap img').forEach(img => {
  img.style.cursor = 'zoom-in';
  img.addEventListener('click', () => openLightbox(img.src));
});
document.querySelectorAll('.cert-img-wrap').forEach(wrap => {
  wrap.addEventListener('click', () => {
    const img = wrap.querySelector('img');
    if (img) openLightbox(img.src);
  });
});

function handleFormSubmit() {
  const btn = event.target;
  btn.innerHTML = '✓ Message Sent!';
  btn.style.background = '#00a854';
  setTimeout(() => {
