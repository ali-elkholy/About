<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ali Elkholy — Unified Collaboration Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f2ee;
  --surface: rgba(255,253,249,0.78);
  --surface2: rgba(255,253,249,0.5);
  --border: rgba(255,255,255,0.85);
  --border2: rgba(120,90,50,0.10);
  --blue: #2c5282;
  --blue-mid: #3a6fc4;
  --blue-light: #6b9de8;
  --teal: #9c7c50;
  --accent: #7b5e3a;
  --warm1: #c4a882;
  --warm2: #977359;
  --warm3: #6b4f2f;
  --text: #1a1510;
  --text2: #3b2f22;
  --text3: #8a7560;
  --shadow: 0 8px 32px rgba(80,50,20,0.10);
  --shadow-lg: 0 20px 60px rgba(80,50,20,0.16);
  --glass: blur(18px) saturate(160%);
  --radius: 20px;
  --radius-sm: 12px;
  --transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  line-height: 1.6;
}

/* ── LIGHTBOX ── */
#lightbox {
  display: none; position: fixed; inset: 0; z-index: 999;
  background: rgba(10,8,5,0.88);
  backdrop-filter: blur(10px);
  align-items: center; justify-content: center;
  padding: 24px;
  cursor: zoom-out;
}
#lightbox.open { display: flex; animation: fadeIn 0.3s ease; }
#lightbox img {
  max-width: min(95vw, 960px);
  max-height: 90vh;
  border-radius: 12px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  cursor: default;
  object-fit: contain;
  animation: zoomIn 0.35s cubic-bezier(0.23,1,0.32,1);
}
#lightbox-close {
  position: fixed; top: 20px; right: 24px;
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
  color: white; font-size: 1.2rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
#lightbox-close:hover { background: rgba(255,255,255,0.22); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes zoomIn { from { transform: scale(0.88); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #ede8e0; }
::-webkit-scrollbar-thumb { background: var(--warm2); border-radius: 3px; }

/* ── CANVAS BACKGROUND ── */
#bg-canvas {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  opacity: 0.55;
}

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 0 5%;
  height: 68px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(240,244,248,0.75);
  backdrop-filter: var(--glass);
  -webkit-backdrop-filter: var(--glass);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 24px rgba(0,80,200,0.07);
  transition: var(--transition);
}

.nav-logo {
  font-size: 1.1rem; font-weight: 700; color: var(--warm3);
  letter-spacing: -0.02em;
  display: flex; align-items: center; gap: 10px;
  text-decoration: none;
}

.nav-logo svg { width: 32px; height: 32px; }

.nav-links {
  display: flex; gap: 32px; list-style: none;
}

.nav-links a {
  color: var(--text2); text-decoration: none; font-size: 0.85rem;
  font-weight: 500; letter-spacing: 0.02em; text-transform: uppercase;
  position: relative; padding: 4px 0;
  transition: color 0.25s;
}

.nav-links a::after {
  content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
  height: 2px; background: var(--warm2);
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.3s ease;
}

.nav-links a:hover { color: var(--warm2); }
.nav-links a:hover::after { transform: scaleX(1); }

.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; }
.hamburger span { width: 24px; height: 2px; background: var(--text2); border-radius: 2px; transition: 0.3s; }

/* ── HERO ── */
#hero {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: grid; grid-template-columns: 1fr 1fr;
  align-items: center;
  padding: 100px 8% 80px;
  gap: 40px;
}

.hero-content { animation: fadeInLeft 0.9s ease both; }

.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(151,115,89,0.10); border: 1px solid rgba(151,115,89,0.25);
  color: var(--warm2); padding: 6px 14px; border-radius: 100px;
  font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; margin-bottom: 24px;
}

.hero-badge span { width: 8px; height: 8px; background: var(--warm1); border-radius: 50%; animation: pulse 2s infinite; }

.hero-name {
  font-size: clamp(2.8rem, 5vw, 4.2rem);
  font-weight: 800; line-height: 1.05;
  letter-spacing: -0.03em; color: var(--text);
  margin-bottom: 8px;
}

.hero-name span { color: var(--blue-mid); }

.hero-title {
  font-size: clamp(1rem, 1.8vw, 1.25rem);
  color: var(--text2); font-weight: 500; margin-bottom: 16px;
  min-height: 2em;
}

.hero-subtitle {
  font-size: 0.95rem; color: var(--text3); line-height: 1.75;
  max-width: 520px; margin-bottom: 40px;
}

.hero-btns { display: flex; gap: 14px; flex-wrap: wrap; }

.btn-primary {
  background: var(--blue); color: white;
  padding: 14px 28px; border-radius: 12px;
  font-size: 0.9rem; font-weight: 600; text-decoration: none;
  display: inline-flex; align-items: center; gap: 8px;
  transition: var(--transition); border: none; cursor: pointer;
  box-shadow: 0 6px 20px rgba(0,87,184,0.35);
}
.btn-primary:hover { background: var(--blue-mid); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,87,184,0.4); }

.btn-outline {
  background: transparent; color: var(--blue);
  padding: 14px 28px; border-radius: 12px;
  font-size: 0.9rem; font-weight: 600; text-decoration: none;
  display: inline-flex; align-items: center; gap: 8px;
  transition: var(--transition); cursor: pointer;
  border: 2px solid rgba(0,87,184,0.3);
  backdrop-filter: blur(8px);
}
.btn-outline:hover { background: rgba(0,87,184,0.06); border-color: var(--blue); transform: translateY(-2px); }

.hero-visual {
  position: relative; animation: fadeInRight 0.9s 0.2s ease both;
  display: flex; justify-content: center; align-items: flex-end;
}

.hero-photo-wrap {
  position: relative;
  width: 100%;
  max-width: 420px;
}

.hero-photo-glow {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 60% 40%, rgba(196,168,130,0.25) 0%, transparent 65%);
  border-radius: 28px; pointer-events: none; z-index: 0;
}

.hero-photo {
  position: relative; z-index: 1;
  width: 100%;
  height: auto;
  display: block;
  border-radius: 28px;
  object-fit: cover;
  object-position: center top;
  box-shadow: 0 24px 64px rgba(60,35,10,0.22), 0 6px 20px rgba(60,35,10,0.10);
}

.hero-photo-border {
  position: absolute; inset: -2px; z-index: 0;
  border-radius: 30px;
  background: linear-gradient(145deg, rgba(196,168,130,0.6), rgba(107,79,47,0.2) 50%, rgba(196,168,130,0.5));
  padding: 2px;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}

.hero-stats {
  position: absolute; bottom: 24px; left: -16px;
  background: rgba(255,253,249,0.88);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.9);
  border-radius: 16px;
  padding: 14px 18px; box-shadow: 0 8px 28px rgba(60,35,10,0.14);
  display: flex; gap: 18px;
  animation: floatCard 5s ease-in-out infinite;
  z-index: 2;
}

.stat { text-align: center; }
.stat-num { font-size: 1.4rem; font-weight: 800; color: var(--warm3); line-height: 1; }
.stat-lbl { font-size: 0.68rem; color: var(--text3); font-weight: 500; margin-top: 3px; white-space: nowrap; }

.hero-cert-badge {
  position: absolute; top: 24px; right: -16px;
  background: rgba(255,253,249,0.88);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.9);
  border-radius: 14px;
  padding: 12px 16px; box-shadow: 0 8px 28px rgba(60,35,10,0.14);
  font-size: 0.74rem; color: var(--warm3); font-weight: 700;
  animation: floatCard2 4s ease-in-out infinite;
  text-align: center; z-index: 2; line-height: 1.5;
}

/* ── SECTIONS ── */
section { position: relative; z-index: 1; padding: 100px 8%; }

.section-label {
  font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--warm2);
  margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
}
.section-label::before {
  content: ''; width: 30px; height: 2px; background: var(--warm2);
}

.section-title {
  font-size: clamp(1.8rem, 3.5vw, 2.8rem);
  font-weight: 800; letter-spacing: -0.03em;
  color: var(--text); margin-bottom: 16px;
}

.section-sub {
  font-size: 1rem; color: var(--text3); max-width: 560px;
  line-height: 1.75; margin-bottom: 60px;
}

/* ── ABOUT ── */
#about { background: linear-gradient(180deg, transparent 0%, rgba(0,115,230,0.03) 100%); }

.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }

.about-text p { color: var(--text2); line-height: 1.85; margin-bottom: 20px; font-size: 0.97rem; }

.about-highlights {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 32px;
}

.highlight-chip {
  background: var(--surface); backdrop-filter: var(--glass);
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  padding: 14px 16px; display: flex; align-items: center; gap: 10px;
  font-size: 0.82rem; font-weight: 600; color: var(--text2);
  transition: var(--transition); cursor: default;
  box-shadow: var(--shadow);
}
.highlight-chip:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: rgba(0,115,230,0.25); }
.highlight-chip svg { flex-shrink: 0; color: var(--blue-mid); }

.about-visual {
  background: var(--surface); backdrop-filter: var(--glass);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 32px; box-shadow: var(--shadow);
}

.info-row {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 0; border-bottom: 1px solid var(--border2);
  font-size: 0.88rem;
}
.info-row:last-child { border-bottom: none; padding-bottom: 0; }
.info-row svg { color: var(--blue-mid); flex-shrink: 0; }
.info-row strong { color: var(--text); margin-right: 4px; }
.info-row span { color: var(--text3); }

/* ── EXPERIENCE ── */
#experience { background: rgba(255,255,255,0.4); backdrop-filter: blur(4px); }

.timeline {
  position: relative; max-width: 860px; margin: 0 auto;
}

.timeline::before {
  content: ''; position: absolute; left: 28px; top: 0; bottom: 0;
  width: 2px; background: linear-gradient(180deg, var(--warm3), var(--warm1));
  border-radius: 2px;
}

.timeline-item {
  position: relative; padding-left: 72px; margin-bottom: 48px;
  opacity: 0; transform: translateY(30px);
  transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}
.timeline-item.visible { opacity: 1; transform: translateY(0); }

.timeline-dot {
  position: absolute; left: 16px; top: 20px;
  width: 26px; height: 26px; border-radius: 50%;
  background: white; border: 3px solid var(--warm2);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 4px rgba(151,115,89,0.15);
}
.timeline-dot::after {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: var(--warm2);
}

.timeline-card {
  background: var(--surface); backdrop-filter: var(--glass);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 28px; box-shadow: var(--shadow);
  transition: var(--transition);
}
.timeline-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }

.job-meta { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }

.job-company { font-size: 1.15rem; font-weight: 700; color: var(--text); }
.job-role { font-size: 0.88rem; color: var(--blue-mid); font-weight: 600; margin-top: 2px; }
.job-period {
  background: rgba(0,115,230,0.08); color: var(--blue);
  padding: 4px 12px; border-radius: 100px; font-size: 0.75rem;
  font-weight: 600; white-space: nowrap; font-family: 'JetBrains Mono', monospace;
}

.job-achievements { list-style: none; }
.job-achievements li {
  font-size: 0.88rem; color: var(--text2); line-height: 1.7; padding: 4px 0;
  display: flex; align-items: flex-start; gap: 10px;
}
.job-achievements li::before { content: '›'; color: var(--blue-mid); font-size: 1.1rem; font-weight: 700; flex-shrink: 0; }

/* ── SKILLS ── */
#skills { }

.skills-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

.skill-card {
  background: var(--surface); backdrop-filter: var(--glass);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 24px; box-shadow: var(--shadow);
  transition: var(--transition);
  opacity: 0; transform: translateY(20px);
}
.skill-card.visible { opacity: 1; transform: translateY(0); }
.skill-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: rgba(0,115,230,0.2); }

.skill-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.skill-icon {
  width: 42px; height: 42px; border-radius: 10px;
  background: linear-gradient(135deg, var(--warm3), var(--warm1));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.skill-icon svg { color: white; }
.skill-name { font-size: 0.95rem; font-weight: 700; color: var(--text); }
.skill-level { font-size: 0.75rem; color: var(--text3); margin-top: 1px; }

.skill-bar-track {
  height: 6px; background: rgba(0,115,230,0.1);
  border-radius: 10px; overflow: hidden; margin-bottom: 6px;
}
.skill-bar-fill {
  height: 100%; border-radius: 10px;
  background: linear-gradient(90deg, var(--warm3), var(--warm1));
  width: 0; transition: width 1.2s cubic-bezier(0.23, 1, 0.32, 1);
}

.skill-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.skill-tag {
  font-size: 0.7rem; padding: 3px 10px; border-radius: 100px;
  background: rgba(0,115,230,0.08); color: var(--blue);
  font-weight: 600; border: 1px solid rgba(0,115,230,0.15);
}

/* ── CERTIFICATIONS ── */
#certifications { background: linear-gradient(180deg, transparent, rgba(0,180,216,0.04) 50%, transparent); }

.certs-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 24px;
}

.cert-card {
  background: var(--surface); backdrop-filter: var(--glass);
  border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; box-shadow: var(--shadow);
  transition: var(--transition);
  opacity: 0; transform: translateY(20px);
}
.cert-card.visible { opacity: 1; transform: translateY(0); }
.cert-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }

.cert-img-wrap {
  overflow: hidden; position: relative;
  background: #e8e2d8;
  aspect-ratio: 4/3;
  cursor: pointer;
}
.cert-img-wrap img {
  width: 100%; height: 100%; object-fit: contain;
  transition: transform 0.6s ease;
  padding: 4px;
}
.cert-img-wrap::after {
  content: '🔍 View Full';
  position: absolute; bottom: 8px; right: 8px;
  background: rgba(0,0,0,0.55); color: white;
  font-size: 0.7rem; font-weight: 600;
  padding: 4px 10px; border-radius: 6px;
  opacity: 0; transition: opacity 0.3s;
  pointer-events: none;
}
.cert-card:hover .cert-img-wrap::after { opacity: 1; }
.cert-card:hover .cert-img-wrap img { transform: scale(1.02); }

.cert-info { padding: 20px; }
.cert-badge-label {
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--warm2); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.cert-badge-label::before { content: ''; width: 20px; height: 2px; background: var(--warm2); }
.cert-title { font-size: 0.95rem; font-weight: 700; color: var(--text); line-height: 1.4; margin-bottom: 12px; }

.cert-meta { display: flex; gap: 12px; flex-wrap: wrap; }
.cert-pill {
  font-size: 0.72rem; font-family: 'JetBrains Mono', monospace;
  padding: 4px 10px; border-radius: 6px;
  background: rgba(0,115,230,0.08); color: var(--blue-mid);
  font-weight: 600; border: 1px solid rgba(0,115,230,0.15);
}
.cert-pill.green {
  background: rgba(0,180,100,0.08); color: #00a854;
  border-color: rgba(0,180,100,0.2);
}

.blackbelt-card {
  background: linear-gradient(135deg, #1a0f06 0%, #3b2210 100%);
  border: 1px solid rgba(196,168,130,0.3); border-radius: var(--radius);
  padding: 32px; box-shadow: var(--shadow-lg);
  color: white;
  opacity: 0; transform: translateY(20px);
  transition: var(--transition);
}
.blackbelt-card.visible { opacity: 1; transform: translateY(0); }
.blackbelt-card:hover { transform: translateY(-4px); }

.bb-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.bb-icon {
  width: 52px; height: 52px; background: rgba(196,168,130,0.15);
  border: 2px solid rgba(196,168,130,0.35); border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
}
.bb-title { font-size: 1.2rem; font-weight: 800; color: white; }
.bb-sub { font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-top: 2px; }

.bb-items {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.bb-item {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 12px 14px;
  font-size: 0.8rem; color: rgba(255,255,255,0.85); font-weight: 500;
  display: flex; align-items: center; gap: 8px;
}
.bb-item::before { content: '✦'; color: var(--warm1); font-size: 0.65rem; }

/* ── PROJECTS ── */
#projects { background: rgba(255,255,255,0.35); backdrop-filter: blur(4px); }

.projects-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}

.project-card {
  background: var(--surface); backdrop-filter: var(--glass);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 28px; box-shadow: var(--shadow);
  transition: var(--transition);
  opacity: 0; transform: translateY(20px);
  position: relative; overflow: hidden;
}
.project-card.visible { opacity: 1; transform: translateY(0); }
.project-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--warm3), var(--warm1));
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.4s ease;
}
.project-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.project-card:hover::before { transform: scaleX(1); }

.proj-icon {
  width: 48px; height: 48px; border-radius: 12px; margin-bottom: 18px;
  background: linear-gradient(135deg, rgba(0,87,184,0.12), rgba(0,180,216,0.12));
  border: 1px solid rgba(0,115,230,0.15);
  display: flex; align-items: center; justify-content: center;
  color: var(--blue-mid);
}
.proj-title { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 10px; }
.proj-desc { font-size: 0.85rem; color: var(--text3); line-height: 1.75; margin-bottom: 16px; }

.proj-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.proj-tag {
  font-size: 0.7rem; padding: 3px 10px; border-radius: 6px;
  background: rgba(0,115,230,0.07); color: var(--blue);
  font-weight: 600; border: 1px solid rgba(0,115,230,0.12);
}

/* ── TECH STACK ── */
#techstack { }

.stack-grid {
  display: flex; flex-wrap: wrap; gap: 16px; justify-content: center;
}

.stack-item {
  background: var(--surface); backdrop-filter: var(--glass);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 16px 22px; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 10px;
  font-size: 0.88rem; font-weight: 600; color: var(--text2);
  transition: var(--transition); cursor: default;
  opacity: 0; transform: translateY(10px);
}
.stack-item.visible { opacity: 1; transform: translateY(0); }
.stack-item:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: rgba(0,115,230,0.25); color: var(--blue); }

.stack-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: linear-gradient(135deg, var(--warm3), var(--warm1));
}

/* ── CONTACT ── */
#contact { background: linear-gradient(180deg, transparent, rgba(0,57,184,0.04)); }

.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; }

.contact-info { }
.contact-info p { color: var(--text3); line-height: 1.8; margin-bottom: 32px; }

.contact-links { display: flex; flex-direction: column; gap: 14px; }
.contact-link {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); backdrop-filter: var(--glass);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 16px 20px; text-decoration: none; color: var(--text2);
  font-size: 0.9rem; font-weight: 600;
  transition: var(--transition); box-shadow: var(--shadow);
}
.contact-link:hover { transform: translateX(4px); border-color: rgba(0,115,230,0.25); color: var(--blue); }
.contact-link svg { color: var(--blue-mid); flex-shrink: 0; }

.contact-form {
  background: var(--surface); backdrop-filter: var(--glass);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 36px; box-shadow: var(--shadow);
}

.form-group { margin-bottom: 20px; }
.form-group label {
  display: block; font-size: 0.8rem; font-weight: 600; color: var(--text2);
  margin-bottom: 8px; letter-spacing: 0.02em;
}
.form-group input, .form-group textarea {
  width: 100%; padding: 12px 16px;
  background: rgba(255,255,255,0.6); border: 1px solid rgba(0,115,230,0.15);
  border-radius: 10px; font-family: 'Sora', sans-serif; font-size: 0.9rem;
  color: var(--text); transition: border-color 0.25s, box-shadow 0.25s;
  outline: none;
}
.form-group input:focus, .form-group textarea:focus {
  border-color: var(--blue-mid); box-shadow: 0 0 0 3px rgba(0,115,230,0.1);
}
.form-group textarea { resize: vertical; min-height: 120px; }

/* ── FOOTER ── */
footer {
  position: relative; z-index: 1;
  background: #120d08; color: white;
  padding: 48px 8%; text-align: center;
}

.footer-content { max-width: 600px; margin: 0 auto; }
.footer-logo { font-size: 1.4rem; font-weight: 800; color: var(--warm1); margin-bottom: 8px; }
.footer-sub { font-size: 0.85rem; color: rgba(255,255,255,0.4); margin-bottom: 24px; }
.footer-links { display: flex; justify-content: center; gap: 28px; margin-bottom: 24px; }
.footer-links a { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.82rem; transition: color 0.25s; }
.footer-links a:hover { color: var(--warm1); }
.footer-copy { font-size: 0.78rem; color: rgba(255,255,255,0.25); }

/* ── ANIMATIONS ── */
@keyframes fadeInLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
@keyframes fadeInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.4); } }
@keyframes glowPulse { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
@keyframes floatCard { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes floatCard2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes typing { from { width: 0; } to { width: 100%; } }

/* ── MOBILE ── */
@media (max-width: 900px) {
  nav { padding: 0 5%; }
  .nav-links { display: none; }
  .hamburger { display: flex; }

  #hero { grid-template-columns: 1fr; padding: 90px 6% 60px; text-align: center; }
  .hero-visual { order: -1; padding: 0 20px; }
  .hero-photo-wrap { max-width: 320px; margin: 0 auto; }
  .hero-stats { left: 0; bottom: 16px; font-size: 0.85rem; }
  .hero-cert-badge { right: 0; top: 16px; }
  .hero-subtitle { margin: 0 auto 40px; }
  .hero-btns { justify-content: center; }

  .about-grid, .contact-grid { grid-template-columns: 1fr; }
  .about-highlights { grid-template-columns: 1fr; }
  .bb-items { grid-template-columns: 1fr; }

  section { padding: 70px 6%; }
}

@media (max-width: 520px) {
  .hero-cert-badge { display: none; }
  .skills-grid, .certs-grid, .projects-grid { grid-template-columns: 1fr; }
}
</style>
